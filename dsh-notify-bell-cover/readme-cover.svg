<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="cover-title cover-desc" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <title id="cover-title">dsh-notify-bell — Semantic sounds for the agent moments that need you.</title>
  <desc id="cover-desc">dsh-notify-bell: semantic notification sounds for DeepSeek Harness. Five semantic events (Complete, Approval, Question, Block, Error), five distinct sounds, and a web bell popover for live playback selection. 深色科技风 README 封面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0f18"/><stop offset="1" stop-color="#121827"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2130"/><stop offset="1" stop-color="#161b28"/></linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#bfc9df"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#5573ff" stop-opacity=".22"/><stop offset=".55" stop-color="#5573ff" stop-opacity=".06"/><stop offset="1" stop-color="#5573ff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".48"/></filter>
    <clipPath id="clip"><rect x="24" y="24" width="1232" height="592" rx="22"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace}
      .cap{font-size:11px;font-weight:700;letter-spacing:1.1px}
      .muted{fill:#8993a9}.text{fill:#e8ebf2}.sub{fill:#a7afc1}
    </style>
  </defs>

